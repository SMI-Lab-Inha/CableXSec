# File: pyproject.toml
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2026 Jae Hoon Seo, SMI Lab, Inha University
#
# The published distribution: an sdist and a pure-Python wheel of the `cablexsec` package. The
# version is kept equal to cablexsec.__version__, CITATION.cff and CHANGELOG.md by
# release/check_release_metadata.py.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cablexsec"
version = "0.1.0"
description = "Component-resolved local cross-section mechanics and fatigue of dynamic power cables"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jae Hoon Seo", email = "jaehoon.seo@inha.ac.kr" }]
keywords = [
  "cross-section mechanics",
  "dynamic power cable",
  "floating offshore wind",
  "fretting",
  "helical armour",
  "hysteretic bending",
  "offshore engineering",
  "wire fatigue",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "pydantic>=2",
  "pyyaml>=6.0",
  "rainflow>=3.2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SMI-Lab-Inha/CableXSec"
Documentation = "https://cablexsec.readthedocs.io"
Repository = "https://github.com/SMI-Lab-Inha/CableXSec"
Issues = "https://github.com/SMI-Lab-Inha/CableXSec/issues"
Changelog = "https://github.com/SMI-Lab-Inha/CableXSec/blob/main/CHANGELOG.md"
Releases = "https://github.com/SMI-Lab-Inha/CableXSec/releases"

[project.optional-dependencies]
# Concentric contact quadratic programme (cablexsec.mechanics.contact_qp).
contact = ["clarabel>=0.11,<0.12"]
# Compiled slip-stress and rainflow kernels (cablexsec._numba); without them the
# results agree to round-off, only slower. The lower bound is the tested release.
fast = ["numba>=0.65"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5",
  "ruff>=0.15,<0.16",
  "mypy>=1.11",
  "twine>=5",
]

[project.scripts]
cablexsec-batch = "cablexsec.cli:batch_main"

[tool.setuptools.packages.find]
include = ["cablexsec*"]

[tool.setuptools.package-data]
cablexsec = ["py.typed"]
"cablexsec.cables" = ["*.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "analytical_sanity: closed-form or machine-precision verification gates",
  "independent_method: comparison with an independent computational method",
  "full_scale: published full-scale data checks; scope varies by test",
]

[tool.coverage.run]
branch = true
source = ["cablexsec"]

[tool.coverage.report]
precision = 2
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["cablexsec"]

[tool.ruff.lint.per-file-ignores]
"cablexsec/cables/schema.py" = ["N802", "N815"]
"cablexsec/clamping.py" = ["N815"]
"cablexsec/materials/sn_curves.py" = ["N803", "N815"]
"cablexsec/materials/mean_stress.py" = ["N803", "N815"]
"cablexsec/materials/strain_life.py" = ["N802", "N803", "N815"]
"cablexsec/materials/wear.py" = ["N802", "N803", "N815"]
"cablexsec/api.py" = ["N802", "N803", "N806", "N815"]
"cablexsec/project.py" = ["N815"]
"cablexsec/cable_adapters.py" = ["N802", "N803", "N806", "N815"]
"cablexsec/mechanics/*.py" = ["N802", "N803", "N806", "N815"]
"cablexsec/analysis/*.py" = ["N802", "N803", "N806", "N815"]
"cablexsec/io/*.py" = ["N802", "N803", "N806", "N815"]
"cablexsec/coupling.py" = ["N802", "N803", "N806", "N815"]
"cablexsec/plotting/*.py" = ["N802", "N803", "N806", "N815"]
"examples/*.py" = ["N802", "N803", "N806", "E501"]
"validation/**/*.py" = ["N802", "N803", "N806", "E501"]
"release/*.py" = ["E501"]
"doc/conf.py" = ["E501"]
"tests/*" = ["N802", "N803", "N806", "E501"]

[tool.mypy]
python_version = "3.11"
packages = ["cablexsec"]
strict = true
warn_unreachable = false

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pandas", "yaml", "scipy.*", "rainflow", "clarabel", "numba", "numba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cablexsec.mechanics.hertz_contact"]
warn_return_any = false
