---
# Artificial single-armour three-core cable of Chae, Nam and Shim (2023),
# "Influence of coiling behavior on axial stress in steel wires of submarine
# power cables: A numerical study", Ocean Eng. 288, 116014 (key
# [ChaeNamShim2023]). Public model-to-model case for coiling (parity item 3;
# doc/benchmarks.md, CH-GJ, CH-EI, CH-P, CH-D, CH-CR). The source compares
# CableCAD, UFLEX 2D and DNV Helica on this cross-section; there is no
# measurement.
#
# Read from the source (Table 1 dimensions, Table 2 materials, Sec. 2.1.2
# equivalent power core, Fig. 6 wire count):
#   power core: equivalent rod 39.8 mm (E 77 GPa, nu 0.43) inside an
#     equivalent tube to 70.8 mm (E 506 MPa, nu 0.47), three cores;
#   1st yarn to 157.0 mm, armour 5.0 mm round steel wires to 167.0 mm,
#   2nd yarn 4.0 mm to 175.0 mm;
#   94 armour wires, counted on the UFLEX 2D cross-section (Fig. 6), uniform
#     3.83 deg spacing; the text does not state the number;
#   left-hand (S) lay of cores and armour (Sec. 2.1.2); armour pitch 1.8 m
#     here, the source's shortest (1.8-3.0 m are compared).
# Assumed, because the source does not give them:
#   armour helix radius at the wire centres, 157/2 + 2.5 = 81.0 mm (the
#     source's Table 6 lay angles follow from 78.5 mm);
#   touching cores, r_offset = 70.8 / sqrt(3) mm; the 1st yarn then starts at
#     76.28 mm and is 2.22 mm thick instead of 2.8 mm (Table 1 leaves 0.6 mm
#     of overlap with touching cores);
#   circular string fillers of the source (Fig. 6) as a non-structural
#     annulus between the cores;
#   straight cores (no core_lay block): the core lay pitch is not given;
#   zero manufacturing clamping: all tools start from a stress-free state
#     (Sec. 2.4).
cable:
  name: "Chae, Nam and Shim (2023) artificial coiling cable"
  description: "Single-armour three-core cable, equivalent cores, pitch 1.8 m"
  manufacturer: "Artificial cross-section (public)"
  source_document: "[ChaeNamShim2023] Ocean Eng. 288, 116014, Tables 1-2, Sec. 2.1.2, Fig. 6"

layers:

  - name: core_rod
    layer_type: cylindrical_offset
    material: core_rod_chae2023
    n_cores: 3
    r_offset_m: 0.040877
    r_inner_m: 0.0
    r_outer_m: 0.0199
    source: "[ChaeNamShim2023] Sec. 2.1.2 component 1; r_offset 70.8/sqrt(3) mm rounded up to 0.001 mm (touching cores, assumed)"

  - name: core_tube
    layer_type: cylindrical_offset
    material: core_tube_chae2023
    n_cores: 3
    r_offset_m: 0.040877
    r_inner_m: 0.0199
    r_outer_m: 0.0354
    source: "[ChaeNamShim2023] Sec. 2.1.2 component 2, Table 1 diameter 70.8 mm"

  - name: filler
    layer_type: cylindrical
    material: filler_chae2023
    r_inner_m: 0.0
    r_outer_m: 0.076277
    structural: false
    notes: "Circular string fillers of the source as an equivalent non-structural annulus (assumed)"
    source: "[ChaeNamShim2023] Table 2 sheath and filler; Fig. 6"

  - name: yarn1
    layer_type: cylindrical
    material: yarn_chae2023
    r_inner_m: 0.076277
    r_outer_m: 0.0785
    source: "[ChaeNamShim2023] Table 1 1st yarn to 157.0 mm (2.22 mm with touching cores)"

  - name: armour
    layer_type: helical
    material: steel_chae2023
    n_wires: 94
    d_wire_m: 0.005
    r_helix_m: 0.081
    lay_angle_deg: 15.787897   # atan(2 pi 0.081 / 1.8), pitch 1.8 m
    lay_direction: left_hand
    manufacturing_clamping:
      initial_contact_pressure_Pa: 0.0
      basis: assumed
      source: "[ChaeNamShim2023] Sec. 2.4: zero stress in the unloaded state"
    fretting_sn: ""
    bulk_sn: saevik_2011_flat_steel   # required by the fatigue adapter; no coiling result uses it
    source: "[ChaeNamShim2023] Table 1 (5 mm wires to 167 mm), Fig. 6 (94 wires), Sec. 2.1.2 (S lay)"

  - name: yarn2
    layer_type: cylindrical
    material: yarn_chae2023
    r_inner_m: 0.0835
    r_outer_m: 0.0875
    source: "[ChaeNamShim2023] Table 1 2nd yarn 4.0 mm to 175.0 mm"
