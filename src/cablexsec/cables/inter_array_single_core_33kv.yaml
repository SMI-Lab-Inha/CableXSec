---
# Single-core inter-array dynamic cable — PUBLIC representative template.
#
# Generic, public geometry for a 33 kV single-core wet-design dynamic
# inter-array cable: solid copper conductor (r_inner = 0 — exercises the
# solid-core thermal path), semiconducting conductor screen, XLPE insulation,
# semiconducting insulation screen, copper-tape screen, HDPE bedding,
# double steel-wire armour, HDPE outer sheath. No metallic sheath (polymer
# topology). Values are round representative numbers for a topology integration
# test, NOT a manufacturer design.
#
# Geometry corrected in October 2026 (armour fill check). The
# earlier file declared more armour wires than fit side by side (lateral fill
# n d / (2 pi r cos alpha) of 1.15 and 1.13) and left the conductor and
# insulation screens undeclared (1 mm radial gaps). Wire diameters, radii and
# lay angles are unchanged; each armour layer now has the largest wire count
# with fill <= 1, and the 1 mm semiconducting screens are declared. The
# pre-correction file is kept unchanged as inter_array_single_core_33kv_legacy_r2.yaml
# for reproducing earlier results.
cable:
  name: "Single-core inter-array 33 kV (public representative)"
  description: "33 kV single-core dynamic inter-array cable, polymer sheath"
  manufacturer: "Public representative template"
  source_document: "Representative public geometry (topology template)"
  voltage_kV: 33
  design_life_years: 25
  MBR_dynamic_m: 2.5

environment:
  ambient_C: 15.0
  T4_external_Km_W: 0.5
  frequency_Hz: 50.0
  source: "Representative seabed boundary (topology template)"

layers:

  - name: cu_conductor
    layer_type: cylindrical_offset
    material: copper_stranded
    n_cores: 1
    r_offset_m: 0.0
    r_inner_m: 0.0              # solid core — exercises the r_inner=0 thermal path
    r_outer_m: 0.0097720502380584  # sqrt(300e-6/pi), aligned solid-equivalent Cu
    conductor_area_mm2: 300.0
    construction: aligned_solid_equivalent
    notes: "Representative aligned isotropic conductor; no resolved strand lay or compaction"
    source: "Representative"

  - name: conductor_screen
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 1
    r_offset_m: 0.0
    r_inner_m: 0.0097720502380584  # on the conductor
    r_outer_m: 0.01077         # 1 mm extruded semiconducting screen
    notes: >-
      Extruded semiconducting conductor screen, triple-extruded with the
      insulation. No semiconducting compound is in the material library; it is
      given the insulation XLPE properties, as IEC 60287-2-1 counts
      semiconducting layers as part of the insulation. Declared 18 Oct 2026
      (previously an undeclared 1 mm gap).
    source: "Representative; thermal treatment [IEC60287-2-1]"

  - name: xlpe_insulation
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 1
    r_offset_m: 0.0
    r_inner_m: 0.01077         # on the conductor screen
    r_outer_m: 0.01877         # 8 mm XLPE wall
    electrical:
      permittivity_relative: 2.3
      loss_factor_tan_delta: 0.0004
      vec_exponent_n: 15.0
      thermal_b_k: 12430
      vec_synergism_b: 4420
      field_threshold_kV_mm: 5.0
    source: "Representative; electrical [Mazzanti2007] Table I (XLPE)"

  - name: insulation_screen
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 1
    r_offset_m: 0.0
    r_inner_m: 0.01877
    r_outer_m: 0.01977         # 1 mm extruded semiconducting screen
    notes: >-
      Extruded semiconducting insulation screen, represented with the
      insulation XLPE properties as the conductor screen. Declared 18 Oct 2026
      (previously an undeclared 1 mm gap).
    source: "Representative; thermal treatment [IEC60287-2-1]"

  - name: cu_screen
    layer_type: cylindrical_offset
    material: copper_tape_screen
    n_cores: 1
    r_offset_m: 0.0
    r_inner_m: 0.01977
    r_outer_m: 0.02047
    structural: false
    source: "Representative"

  - name: hdpe_bedding
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.02047
    r_outer_m: 0.02247
    source: "Representative"

  - name: inner_armour
    layer_type: helical
    material: galvanised_steel_armour
    n_wires: 34                # fill 0.976; was 40 (fill 1.15, overlapping), largest count of 4 mm wires with fill <= 1
    d_wire_m: 0.004
    r_helix_m: 0.02447
    lay_angle_deg: 25.0
    lay_direction: right_hand
    manufacturing_clamping:
      initial_contact_pressure_Pa: 2.0e6
      basis: representative
      source: "Representative pressure jump P0 of this demonstration template; not a manufacturer or published value"
    fretting_sn: ""  # Bulk fatigue only; no qualified steel contact-life law.
    bulk_sn: saevik_2011_flat_steel
    source: "Representative"

  - name: outer_armour
    layer_type: helical
    material: galvanised_steel_armour
    n_wires: 40                # fill 0.987; was 46 (fill 1.13, overlapping), largest count of 4 mm wires with fill <= 1
    d_wire_m: 0.004
    r_helix_m: 0.02847
    lay_angle_deg: 25.0
    lay_direction: left_hand
    manufacturing_clamping:
      initial_contact_pressure_Pa: 2.0e6
      basis: representative
      source: "Representative pressure jump P0 of this demonstration template; not a manufacturer or published value"
    fretting_sn: ""  # Bulk fatigue only; no qualified steel contact-life law.
    bulk_sn: saevik_2011_flat_steel
    source: "Representative"

  - name: hdpe_outer_sheath
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.03047
    r_outer_m: 0.03447
    source: "Representative"

aggregate_properties:
  OD_mm: 68.9
