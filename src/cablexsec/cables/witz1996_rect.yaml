---
# Witz (1996) ISSC case-study 2.5-inch non-bonded flexible pipe, TRUE STRIP
# SECTIONS (gap G1) — PUBLIC. The round-wire mapping of the rows on record is
# witz1996.yaml.
#
# Layer geometry and polymer moduli: Witz, Marine Structures 9 (1996) 885-904,
# Table 2; the same data in Ramos and Pesce, J. Offshore Mech. Arct. Eng. 126
# (2004) 141-146, Table 3, which adds the outer-armour lay direction (right
# hand) and the assumed steel moduli and carcass lay angle (Section 4).
# Measured loops: Witz Figs 5 (0 bar) and 6 (300 bar), digitised in
# validation/paper_data/witz1996_fig*_*.csv. Benchmark rows WITZ-EI and WITZ-ID
# in doc/benchmarks.md.
#
# Mapping (stated, not hidden):
# * Tensile armours: 6 mm wide x 3 mm thick rectangular strips (Table 2),
#   sharp corners, loxodromic full-slip state (the package convention).
# * The interlocked carcass and the Zeta pressure armour have no layer type
#   (gap G2): near-hoop helices with the tabulated strip area as PROFILED
#   sections (Table 2 area, tangential inertia It = I_normal, radial inertia
#   Ir = I_lateral, torsional inertia J). Envelopes: carcass 3.5 mm thick
#   (layer thickness) and 9.14 mm wide normal to the strip (its axial pitch
#   at 87.5 deg, fill 1); Zeta 6.2 x 9.25 mm. The radial route therefore
#   runs on the registered geometry.
# * The anti-friction and fabric tapes are isotropic annuli (gap G3), as all
#   ISSC participants except one and as Ramos and Pesce.
# * Helix radius = mid-thickness of the tabulated layer.
#
# IMPORTANT — the initial contact state was not reported. The initial
# external pressure below is IDENTIFIED by CableXSec on the 0-bar loop width
# at zero curvature with mu = 0.10 declared (the value used for this pipe by
# Kraincanic and Kebadze 2001, Yun et al. 2020 and Chu et al. 2026). The
# 0-bar loop width is therefore not a prediction; the 300-bar loop is. One
# bending loop identifies only the combination of mu and this pressure.
# In this strip-section file the value is that of the round-wire bounded
# identification; the strip benchmark (gap G1, solved route) identifies its own.
cable:
  name: "Witz 1996 ISSC 2.5-inch flexible pipe (strip sections)"
  description: "Eight-layer non-bonded flexible riser, ISSC Committee V7 case study"
  manufacturer: "Public (pipe data published in Witz 1996)"
  source_document: "Witz, Marine Structures 9 (1996) 885-904, Table 2; Ramos and Pesce, JOMAE 126 (2004) 141-146, Table 3"

initial_state:
  external_pressure_Pa: 1037264.0
  identification: identified
  calibration_scope: armour_only    # identified with the armour friction law (no cores)
  source: "Identified on [Witz1996] Fig. 5 loop width at zero curvature (552.7 N m), mu = 0.10, bounded chain; scripts/run_validation.py WITZ-ID"

layers:
  - name: carcass
    layer_type: helical
    material: aisi304_witz1996
    n_wires: 1
    wire_shape: profiled
    wire_width_m: 0.00914      # envelope normal to the strip (axial pitch, fill 1)
    wire_thickness_m: 0.0035   # [Witz1996] Table 2 layer thickness
    wire_area_m2: 19.6e-6      # [Witz1996] Table 2
    wire_I_normal_m4: 20.0e-12   # tangential inertia It
    wire_I_lateral_m4: 556.0e-12 # radial inertia Ir
    wire_J_m4: 6.5e-12         # torsional inertia
    r_helix_m: 0.03335         # ID 63.2/2 + 3.5/2 mm
    lay_angle_deg: 87.5        # [RamosPesce2004] Sec. 4
    lay_direction: left_hand
    source: "[Witz1996] Table 2 layer 1; profiled section"

  - name: pressure_sheath
    layer_type: cylindrical
    material: pa12_grilamid_witz1996
    r_inner_m: 0.0351          # ID 70.2 mm
    r_outer_m: 0.0400          # + 4.9 mm
    source: "[Witz1996] Table 2 layer 2"

  - name: zeta_pressure_armour
    layer_type: helical
    material: fi15_steel_witz1996
    n_wires: 2
    wire_shape: profiled
    wire_width_m: 0.00925      # [Witz1996] Table 2 strip 9.25 x 6.2 mm
    wire_thickness_m: 0.0062
    wire_area_m2: 51.5e-6
    wire_I_normal_m4: 100.0e-12  # tangential inertia It
    wire_I_lateral_m4: 771.0e-12 # radial inertia Ir
    wire_J_m4: 204.6e-12
    r_helix_m: 0.04315         # ID 80.1/2 + 6.2/2 mm
    lay_angle_deg: 85.5
    lay_direction: left_hand
    source: "[Witz1996] Table 2 layer 3; 2 strips; profiled section"

  - name: antifriction_tape_inner
    layer_type: cylindrical
    material: pa11_rilsan_witz1996
    r_inner_m: 0.04625         # ID 92.5 mm
    r_outer_m: 0.04775
    source: "[Witz1996] Table 2 layer 4 (84.2 deg tape as isotropic annulus)"

  - name: inner_tensile_armour
    layer_type: helical
    material: fi41_steel_witz1996
    n_wires: 40
    wire_shape: rectangular
    wire_width_m: 0.006        # [Witz1996] Table 2: 6 mm wide x 3 mm thick
    wire_thickness_m: 0.003
    r_helix_m: 0.04925         # ID 95.5/2 + 3.0/2 mm
    lay_angle_deg: 35.0
    lay_direction: left_hand
    source: "[Witz1996] Table 2 layer 5: 40 strips 6 x 3 mm, 35 deg LH"

  - name: antifriction_tape_outer
    layer_type: cylindrical
    material: pa11_rilsan_witz1996
    r_inner_m: 0.05075         # ID 101.5 mm
    r_outer_m: 0.05225
    source: "[Witz1996] Table 2 layer 6 (84.7 deg tape as isotropic annulus)"

  - name: outer_tensile_armour
    layer_type: helical
    material: fi41_steel_witz1996
    n_wires: 44
    wire_shape: rectangular
    wire_width_m: 0.006
    wire_thickness_m: 0.003
    r_helix_m: 0.05375         # ID 104.5/2 + 3.0/2 mm
    lay_angle_deg: 35.0
    lay_direction: right_hand  # [RamosPesce2004] Table 3; Witz Table 2 prints LH
    source: "[Witz1996] Table 2 layer 7: 44 strips 6 x 3 mm, 35 deg; RH per [RamosPesce2004] Table 3"

  - name: fabric_tape
    layer_type: cylindrical
    material: fabric_tape_witz1996
    r_inner_m: 0.05525         # ID 110.5 mm
    r_outer_m: 0.05575         # OD 111.5 mm
    source: "[Witz1996] Table 2 layer 8 (transverse stiffness 300 MPa)"

aggregate_properties:
  OD_mm: 111.5                 # [Witz1996] Table 2
