---
# EXAMPLE CABLE (public data only): the NSW AC 18/30(36) kV 3 x 240 mm2 Cu
# static submarine cable tested in an articulated bend restrictor by
# Thies et al. (2016), Int. J. Marine Energy 16, 65-82,
# doi 10.1016/j.ijome.2016.05.006 ([Thies2016]).
#
# Published by [Thies2016]: the layer list (Table 4: copper wire screen,
# copper tape counter helix, aluminium layer fully bonded to an HDPE layer,
# ...), the outer diameter 123 mm and MBR 2.5 m (Table 5), single galvanised
# steel wire armour, bitumen flooded, PP yarn serving (Sec. 2.3). NOT
# published: every thickness, the armour and screen wire geometry, the core
# lay, the alloys and tempers. The values below are nominal values that
# close the stack on the published diameter, standard values (IEC 60228,
# IEC 60502-2 / HD 620) or values read from published figures (screen wire
# diameter from Fig. 12, wire count and lay from Fig. 11a). Every such value
# is an ASSUMED nominal with the bound stated in its ``notes``; results that
# depend on one must be run at both ends of its bound. This file is an
# example of the per-core screen (gap P1), core slip state (P8) and laminate
# strain-life (P6) inputs, not a manufacturer's design.
#
# Stack (radii, mm): conductor 9.1, conductor screen 9.8, XLPE 17.8,
# insulation screen 18.6, swelling tape 19.0, Cu wires d 0.6 on helix 19.3
# -> 19.6, Cu tape 19.7, swelling tape 20.1, Al foil 20.3, HDPE 22.7 (core OD
# 45.4); cores touching at pitch-circle radius 26.25; fillers to 49.0;
# bedding 52.0; armour d 5.0 on helix 54.5; serving 61.5 (OD 123).
cable:
  name: "NSW 18/30 kV 3x240 Cu static cable (Thies 2016 test specimen), example"
  description: "Three-core cable with per-core Cu wire screen, Cu tape and bonded Al-PE laminate; public reconstruction"
  manufacturer: "Norddeutsche Seekabelwerke (NSW); geometry reconstructed from public data"
  source_document: "[Thies2016] Sec. 2.3, Tables 4-5, Figs 11-12; IEC 60228; IEC 60502-2; CENELEC HD 620"
  voltage_kV: 30
  design_life_years: 25
  MBR_installation_m: 2.5     # [Thies2016] Table 5

core_lay:
  pitch_m: 2.0
  lay_direction: right_hand
  source: "Not published. ASSUMED 2.0 m, bound 1.5-3.0 m (15-30 x bundle diameter)"

layers:

  - name: cu_conductor
    layer_type: cylindrical_offset
    material: copper_stranded
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0
    r_outer_m: 0.0091
    conductor_area_mm2: 240.0
    construction: aligned_solid_equivalent
    notes: "Diameter 18.2 mm, bound 17.8-18.6 (IEC 60228 class 2 compacted)"
    source: "[Thies2016] Sec. 2.3 (3 x 240 mm2 class 2 compacted Cu); IEC 60228"

  - name: conductor_screen
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0091
    r_outer_m: 0.0098
    structural: false
    notes: "Extruded semiconducting screen, 0.7 mm ASSUMED (bound 0.5-1.0)"
    source: "[Thies2016] Table 4 (layer exists)"

  - name: xlpe_insulation
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0098
    r_outer_m: 0.0178
    notes: "8.0 mm nominal wall for 18/30 kV (bound 7.2-8.0)"
    source: "[Thies2016] Sec. 2.3; IEC 60502-2 / HD 620 nominal insulation"

  - name: insulation_screen
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0178
    r_outer_m: 0.0186
    structural: false
    notes: "Extruded semiconducting screen, 0.8 mm ASSUMED (bound 0.6-1.0)"
    source: "[Thies2016] Table 4 (layer exists)"

  - name: swelling_tape_inner
    layer_type: cylindrical_offset
    material: hdpe
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0186
    r_outer_m: 0.0190
    structural: false
    notes: "Semiconducting swelling tape under the wires; polymer stand-in material; 0.4 mm ASSUMED (bound 0.3-0.6)"
    source: "[Thies2016] Sec. 2.3 and Table 4"

  - name: cu_screen_wires
    layer_type: cylindrical_offset
    material: copper_wire_screen
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0190
    r_outer_m: 0.0196
    construction: resolved_wire_screen
    strand_layers:
      - n_wires: 53
        d_wire_m: 0.0006
        r_helix_m: 0.0193
        pitch_m: 0.68773        # 10 deg lay at r 19.3 mm
        lay_direction: right_hand
    outer_face_pressure:
      pressure_Pa: 2.0e5
      identification: assumed_bound
      bounds_Pa: [0.5e5, 5.0e5]
      source: "Not published. Cu tape winding stress 20-50 MPa x t 0.1 mm / r 19.6 mm = 0.10-0.26 MPa, plus HDPE sheath shrink fit; bound 0.05-0.5 MPa"
    bulk_sn: nasution_2014_copper
    notes: "d 0.6 mm measured on [Thies2016] Fig. 12 (bound 0.5-0.7); n 53 and lay 10 deg read from Fig. 11a (bounds 45-60, 7-15 deg); lay hand opposite to the tape, hand not published"
    source: "[Thies2016] Sec. 2.3, Table 4, Figs 11a and 12"

  - name: cu_tape
    layer_type: cylindrical_offset
    material: copper_tape_screen
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0196
    r_outer_m: 0.0197
    structural: false
    strain_life: copper_poon2022
    tape:
      width_m: 0.020
      lay_angle_deg: 50.0
      n_tapes: 1
      lay_direction: left_hand
      source: "Angle 50 deg read from [Thies2016] Fig. 11a (bound 40-60 deg); width not published, 20 mm ASSUMED (bound 10-30 mm); counter helix to the wires"
    notes: "Counter-helix Cu tape, 0.1 mm ASSUMED (bound 0.05-0.15); tape angle 40-60 deg read from Fig. 11a; open helix with the assumed width"
    source: "[Thies2016] Sec. 2.3, Table 4, Fig. 11"

  - name: swelling_tape_outer
    layer_type: cylindrical_offset
    material: hdpe
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0197
    r_outer_m: 0.0201
    structural: false
    notes: "Swelling tape over the screen; polymer stand-in; 0.4 mm ASSUMED (bound 0.3-0.6)"
    source: "[Thies2016] Sec. 2.3 and Table 4"

  - name: al_laminate
    layer_type: cylindrical_offset
    material: aluminium_laminate_foil
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0201
    r_outer_m: 0.0203
    construction: bonded_laminate
    strain_life: aluminium_foil_mus_assumed
    notes: "Smooth Al layer fully bonded to the HDPE core sheath; 0.2 mm ASSUMED (bound 0.15-0.30; foil 0.1-0.3 mm per [Worzyk2009] Sec. 2.3.2); mid radius bound 20.0-20.6 mm"
    source: "[Thies2016] Sec. 2.3 and Table 4"

  - name: hdpe_core_sheath
    layer_type: cylindrical_offset
    material: hdpe
    n_cores: 3
    r_offset_m: 0.02625
    r_inner_m: 0.0203
    r_outer_m: 0.0227
    notes: "2.4 mm from the IEC 60502-2 sheath rule 0.035 D + 1.0 (bound 2.0-3.0)"
    source: "[Thies2016] Table 4 (HDPE); IEC 60502-2"

  - name: pe_fillers
    layer_type: cylindrical
    material: pp_filler
    r_inner_m: 0.0
    r_outer_m: 0.0490
    structural: false
    notes: "Round PE fillers, binder and fibre element as an equivalent annulus (PP stand-in material); core offset bound 25.5-27.0 mm"
    source: "[Thies2016] Sec. 2.3 and Table 4"

  - name: bedding
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.0490
    r_outer_m: 0.0520
    notes: "Non-conductive bedding, 3.0 mm ASSUMED (bound 2.0-3.5); polymer stand-in"
    source: "[Thies2016] Sec. 2.3 and Table 4"

  - name: armour
    layer_type: helical
    material: galvanised_steel_armour
    n_wires: 62
    d_wire_m: 0.005
    r_helix_m: 0.0545
    lay_angle_deg: 15.0
    lay_direction: left_hand
    manufacturing_clamping:
      initial_contact_pressure_Pa: 1.0e6
      basis: assumed
      source: "Not published. Bound 0.25-2.0 MPa; the specimen carried no tension ([Thies2016] Secs 2.4 and 3.3.1)"
    bulk_sn: oc2017_armour_in_air
    notes: "d 5.0 mm (bound 4.0-6.0), lay 15 deg (bound 10-20), n from 95 % fill; bitumen flooded, tested in air"
    source: "[Thies2016] Sec. 2.3 and Table 4"

  - name: pp_yarn_serving
    layer_type: cylindrical
    material: pp_filler
    r_inner_m: 0.0570
    r_outer_m: 0.0615
    structural: false
    notes: "PP yarn serving; thickness closes the stack on the published OD 123 mm"
    source: "[Thies2016] Sec. 2.3, Tables 4 and 5"

aggregate_properties:
  OD_mm: 123.0
