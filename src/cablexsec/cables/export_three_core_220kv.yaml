---
# Three-core export cable — PUBLIC representative template.
#
# Generic, public geometry for a 220 kV three-core export cable: three
# offset cores (Cu + XLPE + lead sheath per core, modelled as offset annuli),
# semiconducting screens with the XLPE properties, PP filler, HDPE bedding,
# an overall corrugated-aluminium metallic sheath
# (cylindrical_shell), double steel armour, HDPE outer sheath. Round
# representative numbers for a topology integration test. The corrugated-Al
# sheath exercises the metallic-sheath wall-stress path with f_corr/SCF.
cable:
  name: "Three-core export 220 kV (public representative)"
  description: "220 kV three-core export cable, corrugated-Al metallic sheath"
  manufacturer: "Public representative template"
  source_document: "Representative public geometry (topology template)"
  voltage_kV: 220
  design_life_years: 30
  MBR_dynamic_m: 4.5

environment:
  ambient_C: 15.0
  T4_external_Km_W: 0.35
  frequency_Hz: 50.0
  source: "Representative buried boundary (topology template)"

core_lay:
  pitch_m: 2.138               # 2 pi r_offset / tan(10 deg), r_offset 0.060 m
  lay_direction: right_hand    # ASSUMED (not stated)
  source: "Representative: the 10 deg conductor-bundle lay angle of [Janocha2024] Table 1 at this cable's core-centre radius"

layers:

  - name: cu_conductor
    layer_type: cylindrical_offset
    material: copper_stranded
    n_cores: 3
    r_offset_m: 0.060
    r_inner_m: 0.0
    r_outer_m: 0.0190           # bundle envelope; metal area specified separately
    conductor_area_mm2: 1000.0
    construction: stranded
    notes: "Internal lay unspecified; axial calculation uses stated Cu area in an aligned-axis reduction"
    source: "Representative"

  - name: conductor_screen
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 3
    r_offset_m: 0.060
    r_inner_m: 0.0190
    r_outer_m: 0.0210
    structural: false
    notes: "Semiconducting screen with the XLPE properties ([IEC60287-2-1] Table 1, note a)"
    source: "Representative"

  - name: xlpe_insulation
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 3
    r_offset_m: 0.060
    r_inner_m: 0.0210
    r_outer_m: 0.0420           # 21 mm XLPE wall (220 kV)
    electrical:
      permittivity_relative: 2.5
      loss_factor_tan_delta: 0.001
      vec_exponent_n: 15.0
      thermal_b_k: 12430
      vec_synergism_b: 4420
      field_threshold_kV_mm: 5.0
    source: "Representative; electrical [IEC60287]/[Mazzanti2007] Table I"

  - name: insulation_screen
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 3
    r_offset_m: 0.060
    r_inner_m: 0.0420
    r_outer_m: 0.0430
    structural: false
    notes: "Semiconducting screen with the XLPE properties ([IEC60287-2-1] Table 1, note a)"
    source: "Representative"

  - name: lead_core_sheath
    layer_type: cylindrical_offset
    material: lead_sheath
    n_cores: 3
    r_offset_m: 0.060
    r_inner_m: 0.0430
    r_outer_m: 0.0455
    structural: false
    source: "Representative per-core lead sheath"

  - name: pp_filler
    layer_type: cylindrical
    material: pp_filler
    r_inner_m: 0.0
    r_outer_m: 0.1075
    structural: false
    notes: "Equivalent annular filler approximation"
    source: "Representative"

  - name: hdpe_bedding
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.1075
    r_outer_m: 0.1105
    source: "Representative"

  - name: al_metallic_sheath
    layer_type: cylindrical_shell
    material: aluminium_corrugated
    r_mid_m: 0.1125
    t_m: 0.003
    f_corrugation: 0.5
    scf: 2.0
    bulk_sn: en1999_1_3_aluminium   # EN 1999-1-3 detail 1.4 (71-7); see sn_curves
    source: "Representative corrugated-Al sheath; f_corr/SCF representative"

  - name: inner_armour
    layer_type: helical
    material: galvanised_steel_armour
    n_wires: 110
    d_wire_m: 0.006
    r_helix_m: 0.1180
    lay_angle_deg: 18.0
    lay_direction: right_hand
    manufacturing_clamping:
      initial_contact_pressure_Pa: 3.0e6
      basis: representative
      source: "Representative pressure jump P0 of this demonstration template; not a manufacturer or published value"
    bulk_sn: saevik_2011_flat_steel
    source: "Representative"

  - name: outer_armour
    layer_type: helical
    material: galvanised_steel_armour
    n_wires: 118
    d_wire_m: 0.006
    r_helix_m: 0.1240
    lay_angle_deg: 18.0
    lay_direction: left_hand
    manufacturing_clamping:
      initial_contact_pressure_Pa: 3.0e6
      basis: representative
      source: "Representative pressure jump P0 of this demonstration template; not a manufacturer or published value"
    bulk_sn: saevik_2011_flat_steel
    source: "Representative"

  - name: hdpe_outer_sheath
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.1270
    r_outer_m: 0.1330
    source: "Representative"

aggregate_properties:
  OD_mm: 266.0
