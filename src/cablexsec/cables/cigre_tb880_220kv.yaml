---
# CIGRE TB 880 / Poradowski-Anders (2025) 220 kV export cable — PUBLIC.
#
# Geometry and materials are from the public benchmark cable of
# Poradowski & Anders, Ocean Engineering 328 (2025) 121027, Table 1
# (construction detailed in CIGRE TB 880, 2022). Public data only: this is
# the section-0.9-safe export demonstration cable. It is modelled here as a
# single-core-equivalent concentric stack (as Poradowski uses for the thermal
# axisymmetric model); radii are cumulative outer radii from the published
# nominal diameters.
#
# Values flagged "representative" are NOT in Poradowski Table 1 (armour lay
# angles; corrugation stiffness factor; armour material). They are typical
# submarine-cable values used only for the mechanical demonstration and are
# clearly marked; the published thermal/electrical reproduction (BM5) does not
# depend on them.
cable:
  name: "CIGRE TB 880 reference export cable"
  description: "220 kV export submarine cable (public benchmark, Poradowski 2025)"
  manufacturer: "Public (CIGRE TB 880, 2022)"
  source_document: "Poradowski & Anders, Ocean Engineering 328 (2025) 121027, Table 1"
  voltage_kV: 220
  design_life_years: 25

environment:
  ambient_C: 15.0                 # [Poradowski2025] Table 1 NOTE 1 (buried 15 degC)
  T4_external_Km_W: 0.3211        # [Poradowski2025] Table 1 NOTE 1 (external/soil)
  frequency_Hz: 50.0
  source: "[Poradowski2025] Table 1 NOTE 1 (directly buried reference case)"

layers:

  - name: cu_conductor
    layer_type: cylindrical_offset
    material: copper_stranded
    n_cores: 1
    r_offset_m: 0.0
    r_inner_m: 0.0
    r_outer_m: 0.0210            # dia 42.0 mm [Poradowski2025] Table 1
    conductor_area_mm2: 1200.0   # [Poradowski2025] Table 1 (stranded Cu)
    construction: stranded
    notes: "Internal lay not tabulated; axial reduction uses actual Cu area, not the envelope. No solid-annulus radial substitution."
    source: "[Poradowski2025] Table 1"

  - name: xlpe_insulation
    layer_type: cylindrical_offset
    material: xlpe_qiao2025
    n_cores: 1
    r_offset_m: 0.0
    r_inner_m: 0.0227            # over conductor screen, dia 45.4 mm
    r_outer_m: 0.0466            # under insulation screen, dia 93.2 mm
    electrical:
      permittivity_relative: 2.5     # [IEC60287-1-1] Table 3, XLPE > 30 kV
      loss_factor_tan_delta: 0.001   # [IEC60287-1-1] Table 3, XLPE > 30 kV
      vec_exponent_n: 15.0           # n0 [Mazzanti2007] Table I (XLPE)
      thermal_b_k: 12430             # B [K] [Mazzanti2007] Table I (XLPE)
      vec_synergism_b: 4420          # b [Mazzanti2007] Table I (XLPE)
      field_threshold_kV_mm: 5.0     # E0 [Mazzanti2007] Table I
      mechanical_beta: 100.0         # CableXSec screening extension (NOT Mazzanti)
    source: "[Poradowski2025] Table 1 (XLPE 23.9 mm); electrical [IEC60287]/[Mazzanti2007] Table I"

  - name: water_barrier
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.0481            # over insulation screen, dia 96.2 mm
    r_outer_m: 0.0517            # dia 103.4 mm (swelling tape)
    structural: false
    source: "[Poradowski2025] Table 1"

  - name: cu_metallic_sheath
    layer_type: cylindrical_shell
    material: copper_tape_screen
    r_mid_m: 0.05650            # corrugated Cu ring (modelled 111.95/113.95 mm)
    t_m: 0.001                  # 1.0 mm [Poradowski2025] Table 1 footnote d
    f_corrugation: 0.5         # representative corrugation stiffness factor (NOT TB 880)
    scf: 2.0                   # representative corrugation-root SCF (NOT TB 880)
    source: "[Poradowski2025] Table 1 footnote d (dims); f_corr/SCF representative"

  - name: anti_corrosion_sheath
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.0613           # dia 122.5 mm
    r_outer_m: 0.0659           # dia 131.75 mm (semi-conductive PE)
    source: "[Poradowski2025] Table 1"

  - name: assembly_filler
    layer_type: cylindrical
    material: pp_filler
    r_inner_m: 0.0659
    r_outer_m: 0.14195          # dia 283.9 mm (assembling / fillers)
    structural: false
    source: "[Poradowski2025] Table 1"

  - name: inner_armour_bedding
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.14195
    r_outer_m: 0.14495          # dia 289.9 mm
    structural: false
    source: "[Poradowski2025] Table 1"

  - name: inner_armour
    layer_type: helical
    material: galvanised_steel_armour   # representative (Poradowski: stainless, non-magnetic)
    n_wires: 128                # [Poradowski2025] Table 1
    d_wire_m: 0.007             # 7.0 mm [Poradowski2025] Table 1
    r_helix_m: 0.14845          # bedding OD + d_wire/2
    lay_angle_deg: 12.0         # representative submarine armour lay angle (NOT TB 880)
    lay_direction: right_hand
    bulk_sn: saevik_2011_flat_steel
    source: "[Poradowski2025] Table 1 (count/dia); lay angle representative; material representative"

  - name: outer_armour_bedding
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.15195
    r_outer_m: 0.15425          # dia 308.5 mm
    structural: false
    source: "[Poradowski2025] Table 1"

  - name: outer_armour
    layer_type: helical
    material: galvanised_steel_armour   # representative (Poradowski: stainless, non-magnetic)
    n_wires: 135                # [Poradowski2025] Table 1
    d_wire_m: 0.007             # 7.0 mm [Poradowski2025] Table 1
    r_helix_m: 0.15775          # bedding OD + d_wire/2
    lay_angle_deg: 12.0         # representative submarine armour lay angle (NOT TB 880)
    lay_direction: left_hand
    bulk_sn: saevik_2011_flat_steel
    source: "[Poradowski2025] Table 1 (count/dia); lay angle representative; material representative"

  - name: outer_cover
    layer_type: cylindrical
    material: hdpe
    r_inner_m: 0.16125          # dia 322.5 mm
    r_outer_m: 0.16755          # dia 335.1 mm
    source: "[Poradowski2025] Table 1"

aggregate_properties:
  OD_mm: 335.1                  # [Poradowski2025] Table 1
