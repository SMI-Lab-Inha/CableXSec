---
# IEA Wind Task 49 66 kV three-core dynamic cable, 300 mm2 conductor: a section
# DERIVED from the public 630 mm2 template (iea_task49_66kv.yaml, Janocha et al.
# 2024) for rehearsing analyses of the 300 mm2 row of the IEA Wind Task 49 design
# basis (Hall et al. 2024, NREL/TP-5000-89709, Table 13, p. 35: D 0.161 m,
# m 36.66 kg/m, EA 469.6 MN, slipping EI 19.92 kN m2 at 50 kN, MBL 470 kN,
# MBR 2.41 m), which publishes aggregate properties only and no layer data.
#
# Derivation (every step an assumption, not published for this cable):
#   * conductor: 300 mm2 area-equivalent solid (r 9.772 mm); stranded envelope
#     20.63 mm with the 630 mm2 fill ratio (28.32/29.90)^2;
#   * radial thicknesses of the conductor screen (2.00 mm), XLPE insulation
#     (11.90 mm, set by the 66 kV voltage class), insulation screen (3.05 mm)
#     with its 0.10 mm copper tape (3.15 mm together),
#     core sheath (3.20 mm), beddings (0.40, 0.20 mm), inner sheath (4.05 mm),
#     armour wires (3.15 mm) and outer sheath (5.15 mm) kept from Janocha et al.
#     (2024) Table 1;
#   * core pitch-circle radius scaled with the core radius (40.81/35.20, laid
#     touching cores at 10 deg); filler radius in the 630 mm2 ratio to the core
#     envelope (75.90/76.01);
#   * armour wire counts from the 630 mm2 coverage (inner 0.873 at 13 deg,
#     outer 0.866 at 10 deg): 122 and 128 wires; lay angles kept;
#   * materials, screen representation (semiconducting screens with the XLPE
#     properties, after the source model's Table 3, and an assumed 0.10 mm
#     copper tape), lay directions, water-ingress state, clamping (zero, not
#     published), thermal boundary and S-N curves as the 630 mm2 template.
# The derived outer diameter is 164.0 mm against 161 mm in Table 13 (+1.9 %).
# Table 13 values are comparison targets (aggregate_properties), not inputs.
# All values are from public sources; no project or partner data.
cable:
  name: "IEA Task 49 66 kV three-core, 300 mm2 (derived from the Janocha 2024 template)"
  description: "66 kV three-core wet-design dynamic inter-array cable, 3 x 300 mm2 Cu (derived section)"
  manufacturer: "Public reference design (Janocha et al. 2024; IEA Wind Task 49)"
  source_document: "Janocha et al., Sustainability 16 (2024) 2899; Hall et al., NREL/TP-5000-89709 (2024)"
  voltage_kV: 66
  design_life_years: 25        # [IEATask49] Section 3 (reference arrays designed for 25 years)
  DFF: 10                      # [IEATask49] Section 3.3.2 (DNV-ST-0119 steel components)
  MBR_dynamic_m: 2.41          # [IEATask49] Table 13, 300 mm2 row

water_ingress:
  design: wet
  armour_annulus: flooded
  source: >-
    No radial metallic barrier in [Janocha2024] Table 1; wet design per
    [CIGRE TB 610] Section 5.4.3 and [OREC2022] Section 3 case study (66 kV)

environment:
  ambient_C: 15.0
  # IEC 60287-2-1 Section 4.2.2 buried single cable, T4 = rho/(2 pi) ln(u +
  # sqrt(u^2 - 1)), u = 2L/De, with ASSUMED burial depth L = 1.0 m and seabed
  # thermal resistivity 0.7 K m/W (De = 0.184 m): T4 = 0.343 K m/W.
  T4_external_Km_W: 0.343
  frequency_Hz: 50.0
  source: "[IEC60287-2-1] 4.2.2 with assumed L = 1.0 m, rho_soil = 0.7 K m/W; ambient assumed"

core_lay:
  pitch_m: 1.2628              # 2 pi r_offset / tan(10 deg); lay 10 deg kept (derived)
  lay_direction: right_hand    # ASSUMED (not stated by the source)
  source: "[Janocha2024] Table 1 conductor-bundle lay angle 10 deg at the core-centre radius"

layers:

  # --- Three power cores (trefoil; r_offset from touching core sheaths) ---
  - name: cu_conductor
    layer_type: cylindrical_offset
    material: copper_janocha2024
    n_cores: 3
    r_offset_m: 0.0354389     # 40.81/35.20 x core radius 30.567 mm (derived, see header)
    r_inner_m: 0.0
    r_outer_m: 0.009772050238058398  # exactly 300 mm2 in the aligned equivalent
    conductor_area_mm2: 300.0  # [IEATask49] Table 13, 300 mm2 row
    construction: aligned_solid_equivalent
    notes: >-
      Stranded copper of 29.90 mm envelope (Table 1, Fig. 4a); wire count and
      pitches are not tabulated. Modelled as the 630 mm2 area-equivalent solid
      (28.32 mm) so the radial solution applies; the stranding voids up to
      14.95 mm are merged into the loose conductor screen.
    source: "[Janocha2024] Table 1 (Conductor 29.90 mm), Section 2.1 (630 mm2)"

  - name: conductor_screen
    layer_type: cylindrical_offset
    material: xlpe_janocha2024
    n_cores: 3
    r_offset_m: 0.0354389
    r_inner_m: 0.009772050238058398  # conductor envelope 10.32 mm less the stranding voids
    r_outer_m: 0.0123172       # 24.63 mm (screen 2.00 mm kept)
    structural: false
    notes: "Loose semiconducting screen with the XLPE properties, as in the 630 mm2 template (Table 3 merges it into the conductor); also spans the stranding voids"
    source: "[Janocha2024] Table 1 (Conductor screen 33.90 mm), Table 3 (merged into the conductor)"

  - name: xlpe_insulation
    layer_type: cylindrical_offset
    material: xlpe_janocha2024
    n_cores: 3
    r_offset_m: 0.0354389
    r_inner_m: 0.0123172
    r_outer_m: 0.0242172       # 48.43 mm (XLPE 11.90 mm kept)
    electrical:
      permittivity_relative: 2.5     # [IEC60287-1-1] Table 3, XLPE
      loss_factor_tan_delta: 0.001   # [IEC60287-1-1] Table 3, XLPE
      vec_exponent_n: 15.0           # [Mazzanti2007] Table I (XLPE), as other templates
      thermal_b_k: 12430
      vec_synergism_b: 4420
      field_threshold_kV_mm: 5.0
    source: "[Janocha2024] Table 1 (Insulation 57.70 mm, XLPE); electrical [IEC60287-1-1]/[Mazzanti2007]"

  - name: insulation_screen
    layer_type: cylindrical_offset
    material: xlpe_janocha2024
    n_cores: 3
    r_offset_m: 0.0354389
    r_inner_m: 0.0242172
    r_outer_m: 0.0272672       # 54.73 mm less the 0.10 mm copper tape
    notes: "Semiconducting screen with the XLPE properties that carries load with the core, as in the 630 mm2 template (Table 3 merges it into the insulation)"
    source: "[Janocha2024] Table 1 (Insulation screen 64.00 mm), Table 3 (merged into the insulation)"

  - name: cu_tape_screen
    layer_type: cylindrical_offset
    material: copper_tape_screen
    n_cores: 3
    r_offset_m: 0.0354389
    r_inner_m: 0.0272672
    r_outer_m: 0.0273672       # 54.73 mm (screen 3.15 mm kept)
    structural: false
    notes: "Metallic screen for the electrical and thermal analyses: loose copper tape of ASSUMED thickness 0.10 mm, as in the 630 mm2 template"
    source: "[Janocha2024] Table 1 (copper screen named; area not published); thickness assumed"

  - name: mdpe_core_sheath
    layer_type: cylindrical_offset
    material: mdpe_janocha2024
    n_cores: 3
    r_offset_m: 0.0354389
    r_inner_m: 0.0273672
    r_outer_m: 0.0305672       # 61.13 mm (sheath 3.20 mm kept)
    source: "[Janocha2024] Table 1 (Conductor sheath 70.40 mm, MDPE)"

  # --- Bundle layers (concentric about the cable axis) ---
  - name: mdpe_filler
    layer_type: cylindrical
    material: mdpe_janocha2024
    r_inner_m: 0.0
    r_outer_m: 0.0659106       # 131.82 mm (75.90/76.01 of the core envelope)
    structural: false
    notes: "Three MDPE filler bodies (lay 10 deg) as the interstitial annulus outside the cores"
    source: "[Janocha2024] Table 1 (Filler 151.80 mm, MDPE)"

  - name: ppy_bedding_inner
    layer_type: cylindrical
    material: ppy_janocha2024
    r_inner_m: 0.0659106
    r_outer_m: 0.0663106       # 132.62 mm (bedding 0.40 mm kept)
    source: "[Janocha2024] Table 1 (Bedding 152.60 mm, PPY)"

  - name: mdpe_inner_sheath
    layer_type: cylindrical
    material: mdpe_janocha2024
    r_inner_m: 0.0663106
    r_outer_m: 0.0703606       # 140.72 mm (sheath 4.05 mm kept)
    source: "[Janocha2024] Table 1 (Inner sheath 160.70 mm, MDPE)"

  - name: inner_armour
    layer_type: helical
    material: steel_janocha2024
    n_wires: 122               # 630 mm2 coverage 0.873 at r_helix 71.94 mm (derived)
    d_wire_m: 0.00315          # [Janocha2024] Section 2.1; Table 1 annulus 160.70-167.00 mm
    r_helix_m: 0.0719356       # inner-sheath radius + wire radius
    lay_angle_deg: 13.0        # [Table 1]
    lay_direction: left_hand   # ASSUMED; opposite to the outer layer [Section 2.1]
    manufacturing_clamping:    # not published: zero, with MissingClampingStateWarning
      armour_winding_stress_Pa: 0.0
      basis: not_published
      source: "[Janocha2024] states no armour winding stress or extrusion pressure; zero is this template's assumption (doc/template_66kv.md Section 4.2)"
    fretting_sn: ""            # bulk fatigue only; no qualified steel contact-life law
    bulk_sn: saevik_2011_flat_steel   # flooded annulus: seawater curve with CP (assumed)
    source: "[Janocha2024] Table 1 (Armour inner 167.00 mm, 13 deg), Section 2.1 (3.15 mm), Fig. 4a (139 wires)"

  - name: ppy_bedding_armour
    layer_type: cylindrical
    material: ppy_janocha2024
    r_inner_m: 0.0735106
    r_outer_m: 0.0737106       # 147.42 mm (bedding 0.20 mm kept)
    source: "[Janocha2024] Table 1 (Bedding 167.40 mm, PPY)"

  - name: outer_armour
    layer_type: helical
    material: steel_janocha2024
    n_wires: 128               # 630 mm2 coverage 0.866 at r_helix 75.29 mm (derived)
    d_wire_m: 0.00315
    r_helix_m: 0.0752856       # bedding radius + wire radius
    lay_angle_deg: 10.0        # [Table 1]
    lay_direction: right_hand  # ASSUMED; opposite to the inner layer [Section 2.1]
    manufacturing_clamping:    # not published: zero, with MissingClampingStateWarning
      armour_winding_stress_Pa: 0.0
      basis: not_published
      source: "[Janocha2024] states no armour winding stress or extrusion pressure; zero is this template's assumption (doc/template_66kv.md Section 4.2)"
    fretting_sn: ""
    bulk_sn: saevik_2011_flat_steel
    source: "[Janocha2024] Table 1 (Armour outer 173.70 mm, 10 deg), Section 2.1 (3.15 mm), Fig. 4a (145 wires)"

  - name: hdpe_outer_sheath
    layer_type: cylindrical
    material: hdpe_janocha2024
    r_inner_m: 0.0768606
    r_outer_m: 0.0820106       # 164.02 mm (sheath 5.15 mm kept)
    source: "[Janocha2024] Table 1 (Outer sheath 184.00 mm, HDPE)"

# Published properties of this cable (comparison targets, not inputs).
aggregate_properties:
  EA_fixed_MN: 469.6           # [IEATask49] Table 13, 300 mm2 row; end-twist condition not stated
  EI_min_kNm2: 19.92           # [IEATask49] Table 13, slipping stiffness at 50 kN
  OD_mm: 161.0                 # [IEATask49] Table 13, 300 mm2 row
  mass_kg_m: 36.66             # [IEATask49] Table 13, 300 mm2 row
  EI_min_tension_kN: 50.0      # [IEATask49] Table 13: slipping stiffness at 50 kN
  MBL_kN: 470.0                # [IEATask49] Table 13, p. 35, 300 mm2 row
  MBL_basis: "approximate: IEA Wind Task 49 design basis (Hall et al. 2024, NREL/TP-5000-89709), Table 13, p. 35, 300 mm2 row; the source gives MBL and MBR as approximate values to which safety factors need to be applied"
