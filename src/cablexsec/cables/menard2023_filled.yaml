---
# Ménard & Cartraud (2023) 8 MW three-core dynamic power cable, with the PP
# interstitial fillers of the source FE model — PUBLIC.
#
# menard2023.yaml (without fillers) stays the BM1 benchmark input; this file
# adds the fillers.
#
# Geometry from Ménard & Cartraud, Marine Structures 91 (2023) 103465, Table 1
# (layer radii/thicknesses, wire counts, helix angles) and Section 6.1 (armour
# and core helical pitches 0.73 / 0.64 / 0.70 m). Material moduli from Table 2.
# Public benchmark cable; every value is published.
#
# Armour mean radii follow the contacting surfaces in Table 1: 37.4+2.0 mm
# and 42.0+2.0 mm. Combining the rounded pitches in Section 6.1 with Table 1
# angles instead gives radii that penetrate the adjacent polymer layers.
# Those rounded pitches are not used to override the cross-section geometry.
# Fig. 18b's analytical displacement amplitude independently agrees with the
# resulting inner-armour radius. Core lay radius follows trefoil packing.
#
# The optical-fibre steel tube is omitted, following source Section 4.1.
# The PP interstitial fillers of the source FE model are included (23 Oct
# 2026) with the PP modulus of Table 2. Table 1 tabulates no filler radii, so
# the filler fills the space among the cores up to the inner sheath; it is
# non-structural (axial over its true area, no bending), and the radial model
# meshes it in the three outer interstices. Earlier results omitted it.
#
# IMPORTANT — the physical initial contact state was not measured. The source
# calibrated a radial pressure P = 0.3 MPa on the ±0.05 1/m cycle and states
# that the manufacturing initial stress is unknown. Full-slip EI_min is an
# independent limit because it is almost insensitive to pressure and friction.
# Hysteresis results are admissible only as a published-calibration transfer to
# the other amplitudes and are never labelled independent validation.
cable:
  name: "Ménard 2023 reference cable, with fillers"
  description: "8 MW three-core dynamic power cable for floating offshore wind"
  manufacturer: "Public (Ménard & Cartraud 2023)"
  source_document: "Ménard & Cartraud, Marine Structures 91 (2023) 103465"
  voltage_kV: null

# Published reproduction state. Ménard and Cartraud first selected mu=0.2
# from literature, then calibrated this pressure on the independent
# [-0.05, 0.05] 1/m cycle before holding both values fixed for the five other
# loading ranges. Results using this state are calibration-transfer validation,
# not parameter-free prediction.
# Here the bounded pressure chain transmits the declared external pressure
# to both armour faces at zero tension. It does not reproduce the source FE
# model's deformed polymer contact surfaces or determine their local pressure.
core_lay:
  pitch_m: 0.70
  lay_direction: right_hand
  source: "[MenardCartraud2023] Section 6.1; positive core lay in Table 1"

initial_state:
  external_pressure_Pa: 300000.0
  identification: published_calibration
  calibration_scope: all_contacts   # the source FE has friction on every contact (Section 5)
  source: "[MenardCartraud2023] Sections 5.1-5.3, P = 0.3 MPa"

layers:

  # --- Three power cores (source lay angle 9.0 deg, lay radius 17.667 mm) ---
  - name: cu_conductor
    layer_type: cylindrical_offset
    material: copper_menard2023
    n_cores: 3
    r_offset_m: 0.017667      # 15.3/sin(60) mm [Table 1, trefoil packing]
    r_inner_m: 0.0
    r_outer_m: 0.004          # conductor radius 4.0 mm [Table 1]
    source: "[MenardCartraud2023] Table 1 (Conductor r=4.0 mm, 9.0 deg)"

  - name: xlpe_insulation
    layer_type: cylindrical_offset
    material: xlpe_menard2023  # cable-specific E = 350 MPa [MenardCartraud2023] Table 2
    n_cores: 3
    r_offset_m: 0.017667
    r_inner_m: 0.004
    r_outer_m: 0.0113         # insulation outer 11.3 mm (thickness 7.3) [Table 1]
    source: "[MenardCartraud2023] Table 1 (Insulation 11.3 mm, t=7.3 mm)"

  - name: power_core_shield
    layer_type: cylindrical_offset
    material: hdpe_menard2023
    n_cores: 3
    r_offset_m: 0.017667
    r_inner_m: 0.0113
    r_outer_m: 0.0153         # shield outer 15.3 mm (thickness 4.0) [Table 1]
    source: "[MenardCartraud2023] Table 1 (Power core shield 15.3 mm, t=4.0 mm)"

  # --- Bundle layers (concentric about the cable axis) ---
  - name: pp_filler
    layer_type: cylindrical
    material: pp_menard2023
    r_inner_m: 0.0             # fills the interstices from the axis
    r_outer_m: 0.0329          # to the inner sheath
    structural: false          # interstitial: axial only (true area), no bending
    source: "[MenardCartraud2023] FE model with PP fillers; Table 2 (PP); radii from the neighbouring layers"

  - name: inner_sheath
    layer_type: cylindrical
    material: hdpe_menard2023
    r_inner_m: 0.0329         # inner sheath outer 37.4, t 4.5 -> inner 32.9
    r_outer_m: 0.0374
    source: "[MenardCartraud2023] Table 1 (Inner sheath 37.4 mm, t=4.5 mm)"

  - name: inner_armour
    layer_type: helical
    material: galvanised_steel_armour   # E = 210 GPa = [MenardCartraud2023] Table 2 Steel
    n_wires: 55                # [Table 1]
    d_wire_m: 0.004            # wire radius 2.0 mm -> d = 4.0 mm [Table 1]
    r_helix_m: 0.0394          # inner-sheath outer radius + wire radius [Table 1]
    lay_angle_deg: 20.1        # |−20.1| [Table 1]
    lay_direction: left_hand   # opposed to outer armour (−20.1 deg) [Table 1]
    bulk_sn: saevik_2011_flat_steel
    source: "[MenardCartraud2023] Table 1 (55 wires, wire r=2.0 mm, −20.1 deg; R_h=37.4+2.0 mm)"

  - name: bedding
    layer_type: cylindrical
    material: pfr_menard2023
    r_inner_m: 0.0414         # bedding outer 42.0, t 0.6 -> inner 41.4
    r_outer_m: 0.042
    source: "[MenardCartraud2023] Table 1 (Bedding 42.0 mm, t=0.6 mm, PFR)"

  - name: outer_armour
    layer_type: helical
    material: galvanised_steel_armour
    n_wires: 63                # [Table 1]
    d_wire_m: 0.004            # wire radius 2.0 mm -> d = 4.0 mm [Table 1]
    r_helix_m: 0.044            # bedding outer radius + wire radius [Table 1]
    lay_angle_deg: 19.6        # [Table 1]
    lay_direction: right_hand
    bulk_sn: saevik_2011_flat_steel
    source: "[MenardCartraud2023] Table 1 (63 wires, wire r=2.0 mm, 19.6 deg; R_h=42.0+2.0 mm)"

  - name: outer_sheath
    layer_type: cylindrical
    material: hdpe_menard2023
    r_inner_m: 0.046          # outer sheath outer 50.5, t 4.5 -> inner 46.0
    r_outer_m: 0.0505
    source: "[MenardCartraud2023] Table 1 (Outer sheath 50.5 mm, t=4.5 mm)"

aggregate_properties:
  EI_min_kNm2: 3.593          # analytical full-slip EI_min [MenardCartraud2023] Table 3
  OD_mm: 101.0                # [MenardCartraud2023] Section 2.1
