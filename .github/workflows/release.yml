#
# The published release assets: the sdist, the pure-Python wheel and SHA256SUMS.txt. A manual
# run (workflow_dispatch) builds them as a workflow artifact only (preflight). Publishing a GitHub
# release builds them from the tag, checks that they carry the tag's version, smoke-tests the
# wheel and attaches the three files to the release. Nothing is uploaded to a package index.
name: release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release metadata and audit the tree
        run: |
          python release/check_release_metadata.py
          python release/audit_release_tree.py --tree .
      - name: Build and check the distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip build twine
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --outdir dist
          python -m twine check dist/*
      - name: Check the version against the release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          test -f "dist/cablexsec-${version}-py3-none-any.whl"
          test -f "dist/cablexsec-${version}.tar.gz"
      - name: Smoke-test the wheel in a clean environment
        shell: bash
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          PATH="$PWD/wheel-test/bin:$PATH" wheel-test/bin/python release/smoke_test_wheel.py --version "$version"
      - name: Write the checksum manifest
        shell: bash
        run: cd dist && sha256sum cablexsec-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CableXSec-release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CableXSec-release-assets
          path: dist
      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
